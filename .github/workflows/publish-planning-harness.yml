name: publish-planning-harness

# planning-harness/ 폴더가 main 에 push 되면:
#  1) PUBLISH_REPOSITORY 저장소가 없으면 public 으로 생성
#  2) planning-harness/ 폴더 내용만 새 저장소의 루트에 push
#
# 사전 준비:
#   Settings → Secrets and variables → Actions 에서
#   PUBLISH_REPOSITORY 변수(owner/repository)와 GH_PAT 시크릿을 추가하세요.
on:
  push:
    branches: [main]
    paths:
      - 'planning-harness/**'
      - '.github/workflows/publish-planning-harness.yml'
  workflow_dispatch:

concurrency:
  group: publish-planning-harness
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISH_REPOSITORY: ${{ vars.PUBLISH_REPOSITORY }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate publish settings
        run: |
          test -n "$PUBLISH_REPOSITORY" || { echo "Repository variable PUBLISH_REPOSITORY is missing"; exit 1; }
          echo "$PUBLISH_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' \
            || { echo "PUBLISH_REPOSITORY must use owner/repository format"; exit 1; }

      - name: Create destination repository if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if gh repo view "$PUBLISH_REPOSITORY" --json name > /dev/null 2>&1; then
            echo "Repository $PUBLISH_REPOSITORY already exists — skipping creation."
          else
            gh repo create "$PUBLISH_REPOSITORY" \
              --public \
              --description "Reusable planning workflow and project operations templates" \
              --clone=false
            echo "Created public repository $PUBLISH_REPOSITORY."
          fi

      - name: Sync planning-harness to destination
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          tmp="$(mktemp -d)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${PUBLISH_REPOSITORY}.git"

          # Clone existing repo, or init fresh if it's brand new (empty)
          if git clone "$remote" "$tmp" 2>/dev/null && [ -d "$tmp/.git" ]; then
            echo "Cloned existing repository."
          else
            echo "Initializing fresh repository."
            git init "$tmp"
            git -C "$tmp" remote add origin "$remote"
          fi

          # Replace root contents with planning-harness/ folder contents
          find "$tmp" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R planning-harness/. "$tmp"/

          cd "$tmp"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "planning-harness already up to date — nothing to push."
            exit 0
          fi

          git commit -m "Sync reusable planning harness ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
          git push origin HEAD:main --force-with-lease 2>/dev/null \
            || git push origin HEAD:main --force
          echo "Published $PUBLISH_REPOSITORY."
