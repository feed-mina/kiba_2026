name: deploy-worker

# worker/ 폴더(API 프록시)가 바뀐 채로 main에 push되면 Cloudflare에 자동 배포합니다.
# 정적 페이지(index.html)는 GitHub Pages가 따로 자동 배포하므로 여기서 다루지 않습니다.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:        # 수동 실행도 가능

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check reusable deployment settings
        id: settings
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ALLOWED_REPOS: ${{ vars.ALLOWED_REPOS }}
          PROTECTED_REPOS: ${{ vars.PROTECTED_REPOS }}
          DOCS_BUCKET_NAME: ${{ vars.DOCS_BUCKET_NAME }}
        run: |
          if [ -z "$WORKER_NAME" ] || [ -z "$ALLOWED_ORIGINS" ] || [ -z "$ALLOWED_REPOS" ] || [ -z "$DOCS_BUCKET_NAME" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Worker deployment variables are not configured; keeping the existing deployment unchanged."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure R2 bucket exists
        if: steps.settings.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCS_BUCKET_NAME: ${{ vars.DOCS_BUCKET_NAME }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          buckets="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
          if jq -e --arg name "$DOCS_BUCKET_NAME" 'any(.result.buckets[]; .name == $name)' <<<"$buckets" > /dev/null; then
            echo "R2 bucket $DOCS_BUCKET_NAME already exists."
          else
            npx --yes wrangler@4.118.0 r2 bucket create "$DOCS_BUCKET_NAME"
          fi

      - name: Deploy Worker (wrangler)
        if: steps.settings.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ALLOWED_REPOS: ${{ vars.ALLOWED_REPOS }}
          PROTECTED_REPOS: ${{ vars.PROTECTED_REPOS }}
          DOCS_BUCKET_NAME: ${{ vars.DOCS_BUCKET_NAME }}
          MEETING_ISSUE_REPO: ${{ vars.MEETING_ISSUE_REPO || vars.ALLOWED_REPOS }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: >-
            deploy
            --name ${{ env.WORKER_NAME }}
            --var ALLOWED_ORIGINS:${{ env.ALLOWED_ORIGINS }}
            --var ALLOWED_REPOS:${{ env.ALLOWED_REPOS }}
            --var PROTECTED_REPOS:${{ env.PROTECTED_REPOS }}
            --var DOCS_BUCKET_NAME:${{ env.DOCS_BUCKET_NAME }}
            --var MEETING_ISSUE_REPO:${{ env.MEETING_ISSUE_REPO }}

# 참고
# - 이 Action은 코드와 wrangler.toml의 [vars](ALLOWED_ORIGINS/ALLOWED_REPOS)만 배포합니다.
# - 시크릿(GITHUB_TOKEN, TURNSTILE_SECRET)은 Cloudflare worker에 이미 저장돼 있고
#   배포해도 유지되므로 여기서 다시 넣지 않습니다.
