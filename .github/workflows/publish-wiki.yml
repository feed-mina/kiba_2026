name: publish-wiki

# 범용 Wiki 템플릿을 현재 저장소의 GitHub Wiki로 발행합니다.
# 실제 업무 기록과 회사 내부 자료는 발행 대상에 포함하지 않습니다.
on:
  push:
    branches: [main]
    paths:
      - 'wiki-template/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:        # 수동 실행도 가능

concurrency:
  group: publish-wiki
  cancel-in-progress: false

permissions:
  contents: write           # 같은 저장소의 .wiki.git push 에 사용

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WIKI_SOURCE_DIR: ${{ vars.WIKI_SOURCE_DIR || 'wiki-template' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate template source
        run: |
          test -d "$WIKI_SOURCE_DIR"
          test -f "$WIKI_SOURCE_DIR/Home.md"

      - name: Publish template to the GitHub Wiki repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -z "$(ls -A "$WIKI_SOURCE_DIR" 2>/dev/null)" ]; then
            echo "$WIKI_SOURCE_DIR is empty — nothing to publish"; exit 0
          fi
          wiki_remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          tmp="$(mktemp -d)"
          # Wiki 저장소는 첫 페이지를 웹에서 한 번 만들어야 clone 가능. 없으면 안내 후 skip.
          if ! git clone "$wiki_remote" "$tmp" 2>/dev/null; then
            echo "::warning::Wiki 저장소를 clone 할 수 없습니다. https://github.com/${GITHUB_REPOSITORY}/wiki 에서 첫 페이지를 한 번 생성하세요."
            exit 0
          fi
          # 기존 내용 비우고(.git 제외) 공개 가능한 범용 템플릿으로 교체
          find "$tmp" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R "$WIKI_SOURCE_DIR"/. "$tmp"/
          cd "$tmp"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."; exit 0
          fi
          git commit -m "Publish reusable project wiki template ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]"
          # 기본 브랜치 이름이 master/main 둘 다 가능 → 현재 HEAD 브랜치로 push
          git push origin "HEAD:$(git rev-parse --abbrev-ref HEAD)"
          echo "Published GitHub Wiki."
