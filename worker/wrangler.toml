name = "project-operations"
main = "worker.js"
compatibility_date = "2026-06-29"
workers_dev = true

# 공개 변수 (민감하지 않음) - 본인 환경에 맞게 수정하세요.
[vars]
ALLOWED_ORIGINS = "https://example.github.io"
ALLOWED_REPOS = "owner/repository"
DOCS_BUCKET_NAME = "project-docs-private"
MEETING_ISSUE_REPO = "owner/repository"

# 비공개 문서 저장용 R2 버킷입니다. 먼저 Cloudflare에서 bucket을 만든 뒤 이름을 맞추세요.
[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "project-docs-private"

[observability]
enabled = true
head_sampling_rate = 1

# 시크릿(아래 값들)은 이 파일에 적지 말고 명령어로 등록하세요:
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put DOCS_PASSWORD
#   npx wrangler secret put TURNSTILE_SECRET   (Turnstile 사용 시)
#   npx wrangler secret put CLOVA_CSR_CLIENT_ID
#   npx wrangler secret put CLOVA_CSR_CLIENT_SECRET
#   npx wrangler secret put GEMINI_API_KEY
